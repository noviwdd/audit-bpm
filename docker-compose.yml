services:
  bpm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bpm
    volumes:
      - ./:/var/www
    networks:
      - local
    restart: always

  bpm_nginx:
    image: nginx:latest
    container_name: bpm_nginx
    ports:
      - 4000:80
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bpm
    networks:
      - local
    restart: always

networks:
  local:
    name: local
    external: true